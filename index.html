<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nowcasting Italia - Real Storm Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; background: #0d1117; }
    
    .hud-panel {
      position: absolute; top: 12px; left: 12px; z-index: 1000;
      background: rgba(13, 17, 23, 0.92); border: 1px solid #30363d;
      border-radius: 8px; padding: 12px; color: #c9d1d9;
      font-family: system-ui, -apple-system, sans-serif; font-size: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6); width: 230px;
    }
    .hud-title { font-weight: bold; color: #58a6ff; margin-bottom: 6px; font-size: 13px; text-transform: uppercase; }
    .hud-stat { display: flex; justify-content: space-between; margin-top: 4px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 3px; }
    .hud-val { font-weight: bold; color: #f0f6fc; }
    
    .cell-tag {
      background: rgba(13, 17, 23, 0.9);
      border: 1px solid #ff7b72;
      border-radius: 4px;
      color: #f0f6fc;
      font-family: monospace;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 5px;
      white-space: nowrap;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="hud-panel">
    <div class="hud-title">⚡ NOWCASTING TRACKER</div>
    <div class="hud-stat"><span>Soglia dBZ:</span><span class="hud-val">> 32 dBZ</span></div>
    <div class="hud-stat"><span>Celle Attive:</span><span id="cell-count" class="hud-val">0</span></div>
    <div class="hud-stat"><span>Ultimo Frame:</span><span id="last-update" class="hud-val">--:--</span></div>
  </div>

  <script>
    const map = L.map('map', { zoomControl: false }).setView([41.9, 12.5], 6);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Mappa Muta scura libera al 100% senza API KEY
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_labels_under/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let radarLayer = null;
    let trackerGroup = L.layerGroup().addTo(map);

    async function updateTracker() {
      try {
        const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        const data = await res.json();
        if (!data || !data.radar || !data.radar.past || data.radar.past.length < 2) return;

        const past = data.radar.past;
        const frame1 = past[past.length - 1];

        if (radarLayer) map.removeLayer(radarLayer);
        radarLayer = L.tileLayer(`${data.host}${frame1.path}/256/{z}/{x}/{y}/2/1_1.png`, {
          opacity: 0.65
        }).addTo(map);

        const d = new Date(frame1.time * 1000);
        document.getElementById('last-update').innerText = 
          d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');

      } catch (e) {
        console.error("Errore aggiornamento:", e);
      }
    }

    updateTracker();
    setInterval(updateTracker, 300000);
  </script>
</body>
</html>
